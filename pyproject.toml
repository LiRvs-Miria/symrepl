[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symrepl"
version = "0.2.0"
description = "Replay symbolic-execution counterexamples under LLDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [{ name = "LiRvs-Miria" }]
keywords = [
  "klee",
  "lldb",
  "symbolic-execution",
  "debugger",
  "program-analysis",
  "concolic-testing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

# No installable package: the DAP face runs as checkout-tree scripts
# (src/server) and the tool is driven in place (probes, tests, client).
# Packaging returns when a real consumer needs to import it.

[tool.pytest.ini_options]
testpaths = ["tests"]
