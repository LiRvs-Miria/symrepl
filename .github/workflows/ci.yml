name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pytest hypothesis
      - name: Test
        run: pytest -q
      - name: Closed nets (no LLDB)
        run: |
          python3 probes/probe_framing.py
          python3 probes/probe_childseam.py
          python3 probes/test_core.py
          python3 probes/probe_ktest.py
          python3 probes/probe_branches.py
